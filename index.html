        :root {
            --bg-color: #fdfbf7;

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1, h2, h3 {
            font-family: sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        h1 {
            margin-bottom: 5px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            margin-bottom: 30px;
            font-style: italic;
            color: #555;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        /* Process View */
        .process-view {
            display: flex;
            gap: 20px;
            height: 400px;
        }

        .grid-container {
            flex: 2;
            background: var(--secondary-bg);
            border: 1px solid var(--border-color);
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(12px, 1fr));
            gap: 4px;
            overflow-y: auto;
        }

        .agent-dot {
            width: 12px;
            height: 12px;
            background-color: var(--border-color);
            border-radius: 50%;
            transition: background-color 0.3s;
        }

        .agent-dot.active {
            background-color: var(--accent-color);
            box-shadow: 0 0 5px var(--accent-color);
        }

        .feed-container {
            flex: 1;
            background: var(--secondary-bg);
            border: 1px solid var(--border-color);
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .feed-item {
            font-size: 0.9em;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            opacity: 0;
            animation: fadeIn 0.5s forwards;
        }

        .feed-item:last-child {
            border-bottom: none;
        }

        .camp-label {
            font-weight: bold;
            font-family: sans-serif;
            font-size: 0.8em;
            text-transform: uppercase;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* Result View */
        .result-view {
            background: var(--secondary-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            display: none; /* Initially hidden until simulation completes */
        }

        .ranking-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .ranking-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .team-name {
            width: 120px;
            font-family: sans-serif;
            text-transform: uppercase;
            font-weight: bold;
        }

        .bar-container {
            flex: 1;
            height: 20px;
            background-color: var(--border-color);
            position: relative;
        }

        .bar {
            height: 100%;
            background-color: var(--text-color);
            width: 0%;
            transition: width 1s ease-out;
        }

        .bar-number {
            position: absolute;
            right: 5px;
            top: 2px;
            color: var(--bg-color);
            font-weight: bold;
        }

        .insights {
            margin-top: 20px;
            font-size: 1.1em;
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
        }

        .insight-accent {
            color: var(--accent-color);
            font-weight: bold;
        }

        /* Divergence View */
        .divergence-view {
            background: var(--secondary-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            display: none; /* Initially hidden */
        }

        .toggle-btn {
            background: var(--text-color);
            color: var(--bg-color);
            border: none;
            padding: 10px 20px;
            font-family: sans-serif;
            text-transform: uppercase;
            cursor: pointer;
            margin-bottom: 15px;
        }

        .toggle-btn:hover {
            background: var(--accent-color);
        }

        .camps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .camp-box {
            border: 1px solid var(--border-color);
            padding: 10px;
        }

        .camp-title {
            font-family: sans-serif;
            font-weight: bold;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
            margin-bottom: 10px;
        }

        .camp-result-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

    </style>
</head>

        // State
        let processedAgents = 0;
        const totalAgents = agentsData.length;
        const results = {};
        const campResults = {};

        // DOM Elements
        const gridContainer = document.getElementById('agentGrid');
        const feedContainer = document.getElementById('feedContainer');
        const processView = document.getElementById('processView');
        const resultView = document.getElementById('resultView');
        const rankingContainer = document.getElementById('rankingContainer');
        const insightsContainer = document.getElementById('insightsContainer');
        const toggleDivergenceBtn = document.getElementById('toggleDivergenceBtn');
        const divergenceView = document.getElementById('divergenceView');
        const campsGrid = document.getElementById('campsGrid');

        // Initialize Grid
        function initGrid() {
            agentsData.forEach(agent => {
                const dot = document.createElement('div');
                dot.className = 'agent-dot';
                dot.id = `dot-${agent.id}`;
                gridContainer.appendChild(dot);
            });
        }

        // Add to Feed
        function addFeedItem(agent) {
            const item = document.createElement('div');
            item.className = 'feed-item';
            item.innerHTML = `<span class="camp-label">${agent.camp}:</span> ${agent.predicted_winner} - "${agent.reasoning}"`;
            feedContainer.insertBefore(item, feedContainer.firstChild);

            // Keep feed size manageable
            if (feedContainer.children.length > 20) {
                feedContainer.removeChild(feedContainer.lastChild);
            }
        }

        // Process Simulation
        function runSimulation() {
            initGrid();

            let interval = setInterval(() => {
                if (processedAgents >= totalAgents) {
                    clearInterval(interval);
                    setTimeout(showResults, 1000);
                    return;
                }

                // Process batch to make it visually interesting but not too slow
                const batchSize = Math.floor(Math.random() * 5) + 1;

                for (let i = 0; i < batchSize && processedAgents < totalAgents; i++) {
                    const agent = agentsData[processedAgents];

                    // Light up dot
                    const dot = document.getElementById(`dot-${agent.id}`);
                    if (dot) dot.classList.add('active');

                    // Add occasional feed item
                    if (Math.random() < 0.15 || processedAgents === totalAgents - 1) {
                        addFeedItem(agent);
                    }

                    // Tally results
                    results[agent.predicted_winner] = (results[agent.predicted_winner] || 0) + 1;

                    if (!campResults[agent.camp]) campResults[agent.camp] = {};
                    campResults[agent.camp][agent.predicted_winner] = (campResults[agent.camp][agent.predicted_winner] || 0) + 1;

                    processedAgents++;
                }
            }, 50); // Speed of simulation
        }

        // Start everything on load
        window.onload = runSimulation;

        // Show Results
        function showResults() {
            processView.style.display = 'none';
            resultView.style.display = 'block';
            toggleDivergenceBtn.style.display = 'block';

            // Sort results
            const sortedResults = Object.entries(results).sort((a, b) => b[1] - a[1]);
            const top8 = sortedResults.slice(0, 8);
            const maxVotes = top8[0] ? top8[0][1] : 1;

            // Render Ranking
            top8.forEach((entry, index) => {
                const team = entry[0];
                const votes = entry[1];
                const percentage = (votes / maxVotes) * 100;

                const row = document.createElement('div');
                row.className = 'ranking-row';

                row.innerHTML = `
                    <div class="team-name">${team}</div>
                    <div class="bar-container">
                        <div class="bar" id="bar-${index}" style="width: 0%;"></div>
                        <div class="bar-number" id="num-${index}">0</div>
                    </div>
                `;
                rankingContainer.appendChild(row);

                // Animate bars and numbers
                setTimeout(() => {
                    const bar = document.getElementById(`bar-${index}`);
                    bar.style.width = `${percentage}%`;

                    animateValue(`num-${index}`, 0, votes, 1000);
                }, 100 * index);
            });

            // Add Insights
            if (sortedResults.length > 0) {
                const favorite = sortedResults[0][0];

                // Find dark horse (lower ranking but surprisingly high votes in specific camps)
                // For simplicity, let's pick a team outside top 3 but inside top 8
                let darkHorse = "None";
                if (sortedResults.length > 3) {
                     // Find the team with the highest divergence (variance) or just a mid-tier
                     darkHorse = sortedResults[Math.min(4, sortedResults.length - 1)][0];
                }

                insightsContainer.innerHTML = `
                    <div><span class="insight-accent">BIGGEST FAVORITE:</span> Data points heavily toward ${favorite} as the overarching consensus choice.</div>
                    <div style="margin-top: 10px;"><span class="insight-accent">UNDERRATED DARK HORSE:</span> Keep an eye on ${darkHorse}, quietly accumulating strong backing in niche analytical camps.</div>
                `;
            }

            renderDivergence();
        }

        // Animate Number count up
        function animateValue(id, start, end, duration) {
            if (start === end) return;
            const obj = document.getElementById(id);
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                obj.innerHTML = Math.floor(progress * (end - start) + start);
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                }
            };
            window.requestAnimationFrame(step);
        }

        // Render Divergence View
        function renderDivergence() {
            Object.keys(campResults).forEach(campName => {
                const campBox = document.createElement('div');
                campBox.className = 'camp-box';

                let campHtml = `<div class="camp-title">${campName}</div>`;

                // Sort teams within camp
                const sortedCampTeams = Object.entries(campResults[campName]).sort((a, b) => b[1] - a[1]).slice(0, 5);

                sortedCampTeams.forEach(entry => {
                    campHtml += `
                        <div class="camp-result-row">
                            <span>${entry[0]}</span>
                            <span>${entry[1]}</span>
                        </div>
                    `;
                });

                campBox.innerHTML = campHtml;
                campsGrid.appendChild(campBox);
            });
        }

        // Toggle Divergence View
        function toggleDivergence() {
            if (divergenceView.style.display === 'none' || divergenceView.style.display === '') {
                divergenceView.style.display = 'block';
                toggleDivergenceBtn.innerText = 'Hide Camp Divergence';
                // Scroll to it
                divergenceView.scrollIntoView({ behavior: 'smooth' });
            } else {
                divergenceView.style.display = 'none';
                toggleDivergenceBtn.innerText = 'Show Camp Divergence';
            }
        }
    </script>
